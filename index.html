<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Juan David Rodríguez — Analista de Datos & Automatización</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta
      name="description"
      content="Analista de Datos | Python · SQL Server · Power BI | Automatización de procesos end-to-end | Bogotá, Colombia"
    />

    <!-- Fuentes de Google Fonts (idénticas a la versión original) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Franklin:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />

    <!-- Aplica el tema guardado ANTES de pintar la página, así evitamos
         el "flash" de ver primero el tema oscuro y luego el claro (o
         viceversa) mientras React todavía se está montando. -->
    <script>
      (function () {
        var guardado = localStorage.getItem("jdr-theme");
        document.documentElement.setAttribute("data-theme", guardado === "light" ? "light" : "dark");
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
